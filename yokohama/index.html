<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FORECAB 横浜">
<meta name="description" content="横浜のイベントから読む、タクシーの需要予報">
<title>FORECAB — 横浜イベント需要予報</title>
<link rel="canonical" href="https://kirakirapink.github.io/forecab/yokohama/">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icon-512.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../style.css?v=2">
</head>
<body>
<header class="app-header">
  <div class="header-main">
    <div>
      <div class="brand">FORE<span class="brand-accent">CAB</span></div>
      <div class="brand-tag">横浜イベント需要予報<span class="brand-tag-en">Yokohama Event Demand Forecast</span></div>
    </div>
    <nav id="region-ribbon" class="region-ribbon" aria-label="地域を選択"></nav>
  </div>
</header>

<div id="freshness-banner" class="freshness-banner" hidden></div>
<nav id="date-tabs" class="date-tabs"></nav>

<main id="app">
  <section id="now-view" class="section"></section>
  <section id="summary" class="section"></section>
  <section id="heatmap" class="section"></section>
  <section class="map-section">
    <div class="map-title-row">
      <h2 class="section-title"><span class="en">Demand Radar</span>需要レーダー</h2>
      <div class="location-controls">
        <button id="get-location-btn" type="button">現在地を取得</button>
        <span id="location-error" aria-live="polite"></span>
      </div>
    </div>
    <div id="venue-map"></div>
  </section>
  <section id="controls" class="section"></section>
  <section id="event-list" class="section"></section>
  <section id="week-view" class="section"></section>
  <section id="feedback-log" class="section"></section>
</main>

<footer class="app-footer" id="footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.FORECAB_PAGE = { id: "yokohama", root: "..", venues: "regional/yokohama-venues.js", data: "data/yokohama/events.js" };
</script>
<script src="../bootstrap.js?v=2"></script>
</body>
</html>
